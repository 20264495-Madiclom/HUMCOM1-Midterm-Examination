  <main class="card-container">
        <p style="text-align: center;"><img src="Sources/Carms.jpg"style="border-radius: 50%;" alt="Profile photo of the portfolio owner" width="150" height="150"></p>
    <h1 text-align:"center";>Contact Me</h1>
    <form action="https://example.com/submit-contact" method="POST">
      <fieldset>
        <legend>Contact Form</legend>


        <p>
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required>
        </p>


        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" minlength="3" required>
        </p>


        <p>
          <label for="topic">Topic:</label>
          <select id="topic" name="topic" required>
            <option value="">-- Select a topic --</option>
            <option value="general">General Inquiry</option>
            <option value="services">Services</option>
            <option value="feedback">Feedback</option>
          </select>
        </p>


        <p>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="4" cols="40" required></textarea>
        </p>


        <p>
          <button type="submit">Send</button>
        </p>
      </fieldset>
    </form>
  </main>
